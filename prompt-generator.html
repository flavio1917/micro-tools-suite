    recipes.forEach(recipe => {
        // COSTRUZIONE DEL PROMPT OTTIMIZZATO
        // Combina Titolo + Ingredienti chiave + Modificatori di stile
        const ingredientsText = recipe.ingredients ? `with visible ${recipe.ingredients.slice(0, 3).join(', ')}` : '';
        
        let prompt = `Professional food photography of ${recipe.title}, ${ingredientsText}, cooked in an air fryer, golden crispy texture, delicious, studio lighting, 4k high resolution, cinematic depth of field, rustic wooden table background`;

        // Se la ricetta ha il nuovo parametro big_image_prompt generato dall'AI, usa quello perché è più dettagliato!
        if (recipe.big_image_prompt) {
            prompt = recipe.big_image_prompt;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="info">
                <h3>${recipe.title} (${recipe.slug}.webp)</h3>
                <p>${prompt}</p>
            </div>
            <button onclick="copyToClipboard('${prompt.replace(/'/g, "\\'")}', this)">COPIA</button>
        `;
        container.appendChild(card);
    });

    function copyToClipboard(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "COPIATO! ✅";
            btn.className = "copied";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.className = "";
            }, 2000);
        });
    }
</script>
